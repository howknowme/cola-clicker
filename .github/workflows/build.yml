name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
      runs-on: macos-latest

      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5.0'

      - name: Create Xcode Project Structure
        run: |
          mkdir -p CocaClicker
          
          # Находим ContentView.swift, убираем из него лишний @main если он там есть, и копируем
          if [ -f "ContentView.swift" ]; then
            sed '/@main/d' ContentView.swift > CocaClicker/ContentView.swift
          else
            echo "import SwiftUI" > CocaClicker/ContentView.swift
            echo "struct ContentView: View {" >> CocaClicker/ContentView.swift
            echo "    var body: some View {" >> CocaClicker/ContentView.swift
            echo "        Text(\"Hello Cola!\")" >> CocaClicker/ContentView.swift
            echo "    }" >> CocaClicker/ContentView.swift
            echo "}" >> CocaClicker/ContentView.swift
          fi
          
          if [ -f "icon.png" ]; then
            mkdir -p CocaClicker/Assets.xcassets/AppIcon.appiconset
            echo '{"images":[{"idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > CocaClicker/Assets.xcassets/AppIcon.appiconset/Contents.json
            cp icon.png CocaClicker/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          fi
          
          # Единственная точка входа с @main
          echo "import SwiftUI" > CocaClicker/App.swift
          echo "@main" >> CocaClicker/App.swift
          echo "struct ColaClickerApp: App {" >> CocaClicker/App.swift
          echo "    var body: some Scene {" >> CocaClicker/App.swift
          echo "        WindowGroup {" >> CocaClicker/App.swift
          echo "            ContentView()" >> CocaClicker/App.swift
          echo "        }" >> CocaClicker/App.swift
          echo "    }" >> CocaClicker/App.swift
          echo "}" >> CocaClicker/App.swift

          echo "name: CocaClicker" > project.yml
          echo "options:" >> project.yml
          echo "  bundleIdPrefix: com.robert.colaclicker" >> project.yml
          echo "targets:" >> project.yml
          echo "  CocaClicker:" >> project.yml
          echo "    type: application" >> project.yml
          echo "    platform: iOS" >> project.yml
          echo "    sources: [CocaClicker]" >> project.yml
          echo "    settings:" >> project.yml
          echo "      GENERATE_INFOPLIST_FILE: \"YES\"" >> project.yml
          
          brew install xcodegen
          xcodegen generate
          
          xcodebuild -project CocaColaClicker.xcodeproj -scheme CocaColaClicker -sdk iphonesimulator -configuration Release build SYMROOT=$(pwd)/build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphonesimulator/CocaColaClicker.app Payload/
          zip -r ColaClicker.ipa Payload/
          
      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColaClicker-ipa
          path: ColaClicker.ipa
