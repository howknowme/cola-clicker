name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build App Manually
      run: |
        # Создаем структуру .app пакета
        APP_NAME="CocaColaClicker"
        BUNDLE_ID="com.robert.colaclicker"
        
        mkdir -p Payload/$APP_NAME.app
        
        # Пишем исходный код ContentView
        cat << 'EOF' > ContentView.swift
        import SwiftUI

        struct ContentView: View {
            @State private var count = 0
            
            var body: some View {
                ZStack {
                    LinearGradient(colors: [.red, .black], startPoint: .top, endPoint: .bottom)
                        .ignoresSafeArea()
                    
                    VStack(spacing: 25) {
                        Text("Coca-Cola Clicker")
                            .font(.largeTitle)
                            .fontWeight(.heavy)
                            .foregroundColor(.white)
                        
                        Text("Score: \(count)")
                            .font(.system(size: 40, weight: .bold))
                            .foregroundColor(.yellow)
                        
                        Spacer()
                        
                        Button(action: {
                            count += 1
                        }) {
                            ZStack {
                                Circle()
                                    .fill(Color.white)
                                    .frame(width: 180, height: 180)
                                    .shadow(radius: 10)
                                
                                VStack(spacing: 5) {
                                    Image(systemName: "cup.and.saucer.fill")
                                        .font(.system(size: 60))
                                        .foregroundColor(.red)
                                    
                                    Text("DRINK!")
                                        .font(.headline)
                                        .fontWeight(.bold)
                                        .foregroundColor(.black)
                                }
                            }
                        }
                        
                        Spacer()
                    }
                    .padding()
                }
            }
        }
        EOF

        # Пишем точку входа App.swift
        cat << 'EOF' > App.swift
        import SwiftUI

        @main
        struct ColaClickerApp: App {
            var body: some Scene {
                WindowGroup {
                    ContentView()
                }
            }
        }
        EOF

        # Компилируем напрямую под arm64 для реального айфона
        swiftc -target arm64-apple-ios17.0 \
               -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -framework SwiftUI \
               -framework UIKit \
               -framework Foundation \
               ContentView.swift App.swift \
               -o Payload/$APP_NAME.app/$APP_NAME

        # Создаем правильный Info.plist
        cat << 'EOF' > Payload/$APP_NAME.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.robert.colaclicker</string>
            <key>CFBundleName</key>
            <string>CocaColaClicker</string>
            <key>CFBundleDisplayName</key>
            <string>CocaColaClicker</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>17.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
            </array>
            <key>UILaunchScreen</key>
            <dict/>
            <key>CFBundleExecutable</key>
            <string>CocaColaClicker</string>
        </dict>
        </plist>
        EOF

        # Запаковываем в готовый .ipa
        zip -r ColaClicker.ipa Payload

    - name: Upload .ipa Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ColaClicker-ipa
        path: ColaClicker.ipa
