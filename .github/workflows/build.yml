name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build with Correct Bundle ID
      run: |
        APP_NAME="CocaColaClicker"
        # Используем твой Bundle ID из .mobileprovision профиля
        BUNDLE_ID="app.forest5669.sapodilla72"
        TEAM_ID="65ZBN43KNV"
        
        mkdir -p Payload/$APP_NAME.app
        
        # Пишем код ContentView.swift
        cat << 'EOF' > ContentView.swift
        import SwiftUI

        struct ContentView: View {
            @State private var count = 0
            
            var body: some View {
                ZStack {
                    Color.black.ignoresSafeArea()
                    VStack(spacing: 25) {
                        Text("Coca-Cola Clicker")
                            .font(.largeTitle)
                            .fontWeight(.heavy)
                            .foregroundColor(.red)
                        
                        Text("Score: \(count)")
                            .font(.system(size: 40, weight: .bold))
                            .foregroundColor(.white)
                        
                        Button(action: {
                            count += 1
                        }) {
                            Text("DRINK COLA")
                                .font(.headline)
                                .padding()
                                .background(Color.red)
                                .foregroundColor(.white)
                                .cornerRadius(15)
                        }
                    }
                }
            }
        }
        EOF

        cat << 'EOF' > App.swift
        import SwiftUI

        @main
        struct ColaClickerApp: App {
            var body: some Scene {
                WindowGroup {
                    ContentView()
                }
            }
        }
        EOF

        # Компилируем под реальный iPhone arm64
        swiftc -target arm64-apple-ios17.0 \
               -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -framework SwiftUI \
               -framework UIKit \
               -framework Foundation \
               ContentView.swift App.swift \
               -o Payload/$APP_NAME.app/$APP_NAME

        # Создаем Info.plist с твоим Bundle ID
        cat << 'EOF' > Payload/$APP_NAME.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>app.forest5669.sapodilla72</string>
            <key>CFBundleName</key>
            <string>CocaColaClicker</string>
            <key>CFBundleDisplayName</key>
            <string>CocaColaClicker</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>17.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
            </array>
            <key>UILaunchScreen</key>
            <dict/>
            <key>CFBundleExecutable</key>
            <string>CocaColaClicker</string>
        </dict>
        </plist>
        EOF

        # Создаем entitlements под твой Team ID и Bundle ID
        cat << 'EOF' > entitlements.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>application-identifier</key>
            <string>65ZBN43KNV.app.forest5669.sapodilla72</string>
            <key>com.apple.developer.team-identifier</key>
            <string>65ZBN43KNV</string>
            <key>get-task-allow</key>
            <true/>
        </dict>
        </plist>
        EOF

        # Подписываем заглушкой с правильными правами
        codesign -s - --entitlements entitlements.plist Payload/$APP_NAME.app

        # Запаковываем в .ipa
        zip -r ColaClicker.ipa Payload

    - name: Upload .ipa Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ColaClicker-ipa
        path: ColaClicker.ipa
