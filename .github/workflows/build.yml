name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
      runs-on: macos-latest

      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5.0'

      - name: Create Xcode Project Structure
        run: |
          mkdir -p Sources
          
          if [ -f "ContentView.swift" ]; then
            sed '/@main/d' ContentView.swift > Sources/ContentView.swift
          else
            echo "import SwiftUI" > Sources/ContentView.swift
            echo "struct ContentView: View {" >> Sources/ContentView.swift
            echo "    var body: some View {" >> Sources/ContentView.swift
            echo "        Text(\"Hello Cola!\")" >> Sources/ContentView.swift
            echo "    }" >> Sources/ContentView.swift
            echo "}" >> Sources/ContentView.swift
          fi
          
          if [ -f "icon.png" ]; then
            mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
            echo '{"images":[{"idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
            cp icon.png Sources/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          fi
          
          echo "import SwiftUI" > Sources/App.swift
          echo "@main" >> Sources/App.swift
          echo "struct ColaClickerApp: App {" >> Sources/App.swift
          echo "    var body: some Scene {" >> Sources/App.swift
          echo "        WindowGroup {" >> Sources/App.swift
          echo "            ContentView()" >> Sources/App.swift
          echo "        }" >> Sources/App.swift
          echo "    }" >> Sources/App.swift
          echo "}" >> Sources/App.swift

          echo "name: CocaColaClicker" > project.yml
          echo "options:" >> project.yml
          echo "  bundleIdPrefix: com.robert.colaclicker" >> project.yml
          echo "targets:" >> project.yml
          echo "  CocaColaClicker:" >> project.yml
          echo "    type: application" >> project.yml
          echo "    platform: iOS" >> project.yml
          echo "    sources: [Sources]" >> project.yml
          echo "    settings:" >> project.yml
          echo "      GENERATE_INFOPLIST_FILE: \"YES\"" >> project.yml
          
          brew install xcodegen
          xcodegen generate
          
          xcodebuild -project CocaColaClicker.xcodeproj -scheme CocaColaClicker -sdk iphonesimulator -configuration Release build SYMROOT=$(pwd)/build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphonesimulator/CocaColaClicker.app Payload/
          zip -r ColaClicker.ipa Payload/
          
      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColaClicker-ipa
          path: ColaClicker.ipa
