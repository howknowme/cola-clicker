name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
      runs-on: macos-latest

      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5.0'

      - name: Create Xcode Project Structure
        run: |
          mkdir -p CocaClicker
          
          # Перемещаем файл игры в правильную папку
          if [ -f "ContentView.swift" ]; then
            mv ContentView.swift CocaClicker/
          fi
          
          # Настраиваем иконку
          if [ -f "icon.png" ]; then
            mkdir -p CocaClicker/Assets.xcassets/AppIcon.appiconset
            echo '{"images":[{"idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > CocaClicker/Assets.xcassets/AppIcon.appiconset/Contents.json
            cp icon.png CocaClicker/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          fi
          
          # Создаем файл приложения
          echo "import SwiftUI" > CocaClicker/ColaClickerApp.swift
          echo "@main" >> CocaClicker/ColaClickerApp.swift
          echo "struct CockacolaClickerApp: SwiftUI.App {" >> CocaClicker/ColaClickerApp.swift
          echo "    var body: some Scene {" >> CocaClicker/ColaClickerApp.swift
          echo "        WindowGroup {" >> CocaClicker/ColaClickerApp.swift
          echo "            CokeClickerView()" >> CocaClicker/ColaClickerApp.swift
          echo "        }" >> CocaClicker/ColaClickerApp.swift
          echo "    }" >> CocaClicker/ColaClickerApp.swift
          echo "}" >> CocaClicker/ColaClickerApp.swift

          # Создаем project.yml для xcodegen
          echo "name: CocaColaClicker" > project.yml
          echo "options:" >> project.yml
          echo "  bundleIdPrefix: com.robert.colaclicker" >> project.yml
          echo "targets:" >> project.yml
          echo "  CocaColaClicker:" >> project.yml
          echo "    type: application" >> project.yml
          echo "    platform: iOS" >> project.yml
          echo "    sources: [CocaClicker]" >> project.yml
          echo "    settings:" >> project.yml
          echo "      GENERATE_INFOPLIST_FILE: \"YES\"" >> project.yml
          
          brew install xcodegen
          xcodegen generate
          
          xcodebuild -project CocaColaClicker.xcodeproj -scheme CocaColaClicker -sdk iphonesimulator -configuration Release build SYMROOT=$(pwd)/build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphonesimulator/CocaColaClicker.app Payload/
          zip -r ColaClicker.ipa Payload/
          
      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColaClicker-ipa
          path: ColaClicker.ipa
