name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
      runs-on: macos-latest

      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5.0'

      - name: Create Xcode Project Structure
        run: |
          mkdir -p Sources
          
          echo "import SwiftUI" > Sources/ContentView.swift
          echo "struct ContentView: View {" >> Sources/ContentView.swift
          echo "    @State private var count = 0" >> Sources/ContentView.swift
          echo "    var body: some View {" >> Sources/ContentView.swift
          echo "        VStack(spacing: 20) {" >> Sources/ContentView.swift
          echo "            Text(\"Coca-Cola Clicker\").font(.largeTitle).bold()" >> Sources/ContentView.swift
          echo "            Text(\"Score: \\(count)\").font(.title)" >> Sources/ContentView.swift
          echo "            Button(\"Drink Cola!\") { count += 1 }" >> Sources/ContentView.swift
          echo "                .buttonStyle(.borderedProminent)" >> Sources/ContentView.swift
          echo "        }" >> Sources/ContentView.swift
          echo "    }" >> Sources/ContentView.swift
          echo "}" >> Sources/ContentView.swift
          
          echo "import SwiftUI" > Sources/App.swift
          echo "@main" >> Sources/App.swift
          echo "struct ColaClickerApp: App {" >> Sources/App.swift
          echo "    var body: some Scene {" >> Sources/App.swift
          echo "        WindowGroup {" >> Sources/App.swift
          echo "            ContentView()" >> Sources/App.swift
          echo "        }" >> Sources/App.swift
          echo "    }" >> Sources/App.swift
          echo "}" >> Sources/App.swift

          # Собираем под реальное устройство с актуальным deploymentTarget
          echo "name: CocaColaClicker" > project.yml
          echo "options:" >> project.yml
          echo "  bundleIdPrefix: com.robert.colaclicker" >> project.yml
          echo "targets:" >> project.yml
          echo "  CocaColaClicker:" >> project.yml
          echo "    type: application" >> project.yml
          echo "    platform: iOS" >> project.yml
          echo "    deploymentTarget: \"17.0\"" >> project.yml
          echo "    sources: [Sources]" >> project.yml
          echo "    settings:" >> project.yml
          echo "      GENERATE_INFOPLIST_FILE: \"YES\"" >> project.yml
          
          brew install xcodegen
          xcodegen generate
          
          # Собираем под iphoneos (реальный айфон) без подписи кодом (для установки через AltStore/Sideloadly)
          xcodebuild -project CocaColaClicker.xcodeproj -scheme CocaColaClicker -sdk iphoneos -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO SYMROOT=$(pwd)/build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/CocaColaClicker.app Payload/
          zip -r ColaClicker.ipa Payload/
          
      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColaClicker-ipa
          path: ColaClicker.ipa
