name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
      runs-on: macos-latest

      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5.0'

      - name: Create Xcode Project Structure
        run: |
          mkdir -p ColaClicker/ColaClicker
          mv ContentView.swift ColaClicker/ColaClicker/
          
          if [ -f "icon.png" ]; then
            mkdir -p ColaClicker/ColaClicker/Assets.xcassets/AppIcon.appiconset
            echo '{"images":[{"idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > ColaClicker/ColaClicker/Assets.xcassets/AppIcon.appiconset/Contents.json
            cp icon.png ColaClicker/ColaClicker/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          fi
          
          echo "import SwiftUI" > ColaClicker/ColaClicker/ColaClickerApp.swift
          echo "@main" >> ColaClicker/ColaClicker/ColaClickerApp.swift
          echo "struct CockacolaClickerApp: SwiftUI.App {" >> ColaClicker/ColaClicker/ColaClickerApp.swift
          echo "    var body: some Scene {" >> ColaClicker/ColaClicker/ColaClickerApp.swift
          echo "        WindowGroup {" >> ColaClicker/ColaClicker/ColaClickerApp.swift
          echo "            CokeClickerView()" >> ColaClicker/ColaClicker/ColaClickerApp.swift
          echo "        }" >> ColaClicker/ColaClicker/ColaClickerApp.swift
          echo "    }" >> ColaClicker/ColaClicker/ColaClickerApp.swift
          echo "}" >> ColaClicker/ColaClicker/ColaClickerApp.swift

          cd ColaClicker
          echo "name: CocaColaClicker" > project.yml
          echo "options:" >> project.yml
          echo "  bundleIdPrefix: com.robert.colaclicker" >> project.yml
          echo "targets:" >> project.yml
          echo "  CocaColaClicker:" >> project.yml
          echo "    type: application" >> project.yml
          echo "    platform: iOS" >> project.yml
          echo "    sources: [ColaClicker]" >> project.yml
          echo "    settings:" >> project.yml
          echo "      GENERATE_INFOPLIST_FILE: \"YES\"" >> project.yml
          echo "      CODE_SIGN_IDENTITY: \"\"" >> project.yml
          echo "      CODE_SIGNING_REQUIRED: \"NO\"" >> project.yml
          echo "      CODE_SIGNING_ALLOWED: \"NO\"" >> project.yml
          
          brew install xcodegen
          xcodegen generate
          
          xcodebuild -project CocaColaClicker.xcodeproj -scheme CocaColaClicker -sdk iphonesimulator -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" CODE_SIGNING_ALLOWED="NO" build SYMROOT=$(pwd)/build

      - name: Package .ipa
        run: |
          cd ColaClicker
          mkdir -p Payload
          cp -r build/Release-iphonesimulator/CocaColaClicker.app Payload/
          zip -r ColaClicker.ipa Payload/
          
      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColaClicker-ipa
          path: ColaClicker/ColaClicker/ColaClicker.ipa
