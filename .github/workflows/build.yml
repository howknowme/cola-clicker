name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: CocaColaClicker
  BUNDLE_ID: app.forest5669.sapodilla72
  TEAM_ID: 65ZBN43KNV

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP="build/${APP_NAME}.app"
          rm -rf build && mkdir -p "$APP"
          xcrun --sdk iphoneos swiftc -sdk "$SDK" \
            -target arm64-apple-ios17.0 -parse-as-library -O \
            -module-name "$APP_NAME" \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            ContentView.swift -o "$APP/$APP_NAME"

      - name: Info.plist and icon
        run: |
          set -euo pipefail
          APP="build/${APP_NAME}.app"
          cat > "$APP/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>${APP_NAME}</string>
            <key>CFBundleIdentifier</key><string>${BUNDLE_ID}</string>
            <key>CFBundleName</key>
